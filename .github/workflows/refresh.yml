name: Refresh live section

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Rebuild live block
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/refresh.sh xnosir dtwinuz/bitg wonmortech/muhr wonmortech/sanad wonmortech/shaffof dtwinuz/teletwin-web
      - name: Commit when changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --quiet && exit 0
          sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/README.md" --jq .sha)"
          gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/README.md" \
            -f message="chore: refresh live section" \
            -f content="$(base64 -w0 README.md)" \
            -f sha="$sha" --silent
